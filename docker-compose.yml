name: orders-cdc

x-pipeline: &pipeline
  build: .
  image: orders-cdc-pipeline:latest
  volumes:
    - warehouse:/warehouse
    - ivy-cache:/root/.ivy2
  environment: &pipeline-env
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: shop
    PG_USER: postgres
    PG_PASSWORD: postgres
    KAFKA_BOOTSTRAP: kafka:9092
    WAREHOUSE: /warehouse

services:
  # ---------- Source system ----------
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      retries: 20

  # ---------- Streaming backbone ----------
  kafka:
    image: apache/kafka:3.8.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      interval: 10s
      retries: 30

  # One-shot: registers (or updates) the Debezium connector, then exits.
  register-connector:
    <<: *pipeline
    depends_on:
      connect: { condition: service_healthy }
    environment:
      <<: *pipeline-env
      CONNECT_URL: http://connect:8083
    command: ["python", "scripts/register_connector.py"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

  # ---------- Workload + processing ----------
  simulator:
    <<: *pipeline
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *pipeline-env
      EVENTS_PER_SEC: "10"
    command: ["python", "-m", "simulator.simulate"]
    restart: unless-stopped

  streamer:
    <<: *pipeline
    depends_on:
      kafka: { condition: service_healthy }
      register-connector: { condition: service_completed_successfully }
    ports: ["4040:4040"]
    command: ["python", "jobs/stream_cdc_to_iceberg.py"]
    restart: unless-stopped

  # Batch jobs (reconcile, quality, gold, maintenance) run on demand:
  #   docker compose run --rm jobs python jobs/reconcile.py
  jobs:
    <<: *pipeline
    profiles: ["jobs"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "jobs/reconcile.py"]

volumes:
  pgdata:
  kafkadata:
  warehouse:
  ivy-cache:
